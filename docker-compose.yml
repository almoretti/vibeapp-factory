services:
  vibeapp-factory:
    image: nginx:alpine
    container_name: vibeapp-factory
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vibeapp-factory.rule=Host(`vibeapp-factory.moretti.cc`)"
      - "traefik.http.routers.vibeapp-factory.entrypoints=https"
      - "traefik.http.routers.vibeapp-factory.tls=true"
      - "traefik.http.routers.vibeapp-factory.tls.certresolver=letsencrypt"
      - "traefik.http.services.vibeapp-factory.loadbalancer.server.port=80"
      - "traefik.http.middlewares.vibeapp-auth.basicauth.users=admin:$$apr1$$yVmdmdAg$$OLencjO39xR1/NszYZxoO/"
      - "traefik.http.routers.vibeapp-factory.middlewares=vibeapp-auth"
      - "traefik.http.routers.vibeapp-factory-http.rule=Host(`vibeapp-factory.moretti.cc`)"
      - "traefik.http.routers.vibeapp-factory-http.entrypoints=http"
      - "traefik.http.routers.vibeapp-factory-http.middlewares=vibeapp-factory-https-redirect"
      - "traefik.http.middlewares.vibeapp-factory-https-redirect.redirectscheme.scheme=https"
    networks:
      - coolify
    extra_hosts:
      - "host.docker.internal:host-gateway"

  code-server:
    image: nginx:alpine
    container_name: code-server-proxy
    restart: unless-stopped
    volumes:
      - ./code-server-nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.code-server.rule=Host(`code.moretti.cc`)"
      - "traefik.http.routers.code-server.entrypoints=https"
      - "traefik.http.routers.code-server.tls=true"
      - "traefik.http.routers.code-server.tls.certresolver=letsencrypt"
      - "traefik.http.services.code-server.loadbalancer.server.port=80"
      - "traefik.http.routers.code-server-http.rule=Host(`code.moretti.cc`)"
      - "traefik.http.routers.code-server-http.entrypoints=http"
      - "traefik.http.routers.code-server-http.middlewares=code-server-https-redirect"
      - "traefik.http.middlewares.code-server-https-redirect.redirectscheme.scheme=https"
    networks:
      - coolify
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dev-server-proxy:
    image: nginx:alpine
    container_name: dev-server-proxy
    restart: unless-stopped
    volumes:
      - ./dev-server-nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      - "traefik.enable=true"
      # Wildcard route for dev-{port}.vibeapp-factory.moretti.cc
      - "traefik.http.routers.dev-server.rule=HostRegexp(`{subdomain:dev-[0-9]+}.vibeapp-factory.moretti.cc`)"
      - "traefik.http.routers.dev-server.entrypoints=https"
      - "traefik.http.routers.dev-server.tls=true"
      - "traefik.http.routers.dev-server.tls.certresolver=letsencrypt"
      - "traefik.http.services.dev-server.loadbalancer.server.port=80"
      # HTTP redirect
      - "traefik.http.routers.dev-server-http.rule=HostRegexp(`{subdomain:dev-[0-9]+}.vibeapp-factory.moretti.cc`)"
      - "traefik.http.routers.dev-server-http.entrypoints=http"
      - "traefik.http.routers.dev-server-http.middlewares=dev-server-https-redirect"
      - "traefik.http.middlewares.dev-server-https-redirect.redirectscheme.scheme=https"
    networks:
      - coolify
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  coolify:
    external: true
